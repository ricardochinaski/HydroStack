name: HydroStack Android Debug APK (offline preview)

on:
  push:
    branches:
      - build/hydrostack-debug-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Configure an isolated offline APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("apps/mobile/android/app/build.gradle.kts")
          content = gradle.read_text()
          plugin = 'id("com.google.gms.google-services")'
          appid = 'applicationId = "com.aselec.hidrosmart"'
          assert plugin in content, "Expected Google Services plugin missing"
          assert appid in content, "Expected application ID missing"
          content = content.replace(plugin, '// Offline CI build: no Google Services configuration', 1)
          content = content.replace(appid, 'applicationId = "com.aselec.hidrosmart.preview"', 1)
          gradle.write_text(content)
          PY

      - name: Fetch dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build Android debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug --no-pub

      - name: Verify APK and checksum
        run: |
          test -s apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          cd apps/mobile/build/app/outputs/flutter-apk
          sha256sum app-debug.apk > SHA256SUMS.txt
          ls -lh app-debug.apk SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HydroStack-V1-offline-debug-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
            apps/mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
